<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playvo</title>
    <!-- Splash loading screen: shown inside #root while the app's JavaScript
         loads; React replaces it on its first render (no timers). Colors:
         Playvo border #E3E8ED + orange #FC4B01. -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .app-splash-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e3e8ed;
        border-top-color: #fc4b01;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-label="جارٍ التحميل / Loading">
        <div class="app-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>  <!-- ابدأ تشغيل JavaScript الخاص بالتطبيق من src/main.jsx.. -->
  </body>
</html>
